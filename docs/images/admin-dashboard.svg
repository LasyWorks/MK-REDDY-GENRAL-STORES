<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>
  
  <!-- Header -->
  <rect width="1200" height="80" fill="#2E7D32"/>
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Admin Dashboard</text>
  <text x="1050" y="50" font-family="Arial, sans-serif" font-size="16" fill="white">MK Stores</text>
  
  <!-- Stats Cards Row 1 -->
  <g transform="translate(30, 110)">
    <!-- Total Sales Card -->
    <rect width="270" height="140" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="14" fill="#666">Total Sales</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#4CAF50">₹2,45,680</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="12" fill="#4CAF50">▲ 12.5% from last month</text>
    <circle cx="230" cy="40" r="20" fill="#E8F5E9"/>
    <text x="230" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4CAF50">💰</text>
  </g>
  
  <g transform="translate(330, 110)">
    <!-- Total Orders Card -->
    <rect width="270" height="140" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="14" fill="#666">Total Orders</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2196F3">1,847</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="12" fill="#2196F3">▲ 8.2% from last month</text>
    <circle cx="230" cy="40" r="20" fill="#E3F2FD"/>
    <text x="230" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2196F3">📦</text>
  </g>
  
  <g transform="translate(630, 110)">
    <!-- Total Customers Card -->
    <rect width="270" height="140" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="14" fill="#666">Total Customers</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FF9800">324</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="12" fill="#FF9800">▲ 15.3% from last month</text>
    <circle cx="230" cy="40" r="20" fill="#FFF3E0"/>
    <text x="230" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#FF9800">👥</text>
  </g>
  
  <g transform="translate(930, 110)">
    <!-- Low Stock Alerts Card -->
    <rect width="240" height="140" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="14" fill="#666">Low Stock Alerts</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#f44336">12</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="12" fill="#f44336">⚠️ Requires attention</text>
    <circle cx="200" cy="40" r="20" fill="#FFEBEE"/>
    <text x="200" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#f44336">📊</text>
  </g>
  
  <!-- Charts Section -->
  <g transform="translate(30, 280)">
    <rect width="560" height="280" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Sales Overview</text>
    
    <!-- Simple bar chart -->
    <g transform="translate(40, 80)">
      <rect x="0" y="120" width="60" height="80" fill="#4CAF50" opacity="0.8"/>
      <rect x="80" y="90" width="60" height="110" fill="#4CAF50" opacity="0.8"/>
      <rect x="160" y="60" width="60" height="140" fill="#4CAF50" opacity="0.8"/>
      <rect x="240" y="100" width="60" height="100" fill="#4CAF50" opacity="0.8"/>
      <rect x="320" y="40" width="60" height="160" fill="#4CAF50"/>
      <rect x="400" y="80" width="60" height="120" fill="#4CAF50" opacity="0.6"/>
      <line x1="0" y1="200" x2="480" y2="200" stroke="#e0e0e0" stroke-width="2"/>
      <text x="20" y="225" font-family="Arial, sans-serif" font-size="11" fill="#999">Jan</text>
      <text x="100" y="225" font-family="Arial, sans-serif" font-size="11" fill="#999">Feb</text>
      <text x="180" y="225" font-family="Arial, sans-serif" font-size="11" fill="#999">Mar</text>
      <text x="260" y="225" font-family="Arial, sans-serif" font-size="11" fill="#999">Apr</text>
      <text x="340" y="225" font-family="Arial, sans-serif" font-size="11" fill="#999">May</text>
      <text x="420" y="225" font-family="Arial, sans-serif" font-size="11" fill="#999">Jun</text>
    </g>
  </g>
  
  <!-- Recent Orders Section -->
  <g transform="translate(620, 280)">
    <rect width="550" height="280" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Recent Orders</text>
    
    <!-- Order rows -->
    <g transform="translate(20, 60)">
      <rect width="510" height="40" fill="#f9f9f9" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="13" fill="#333">#ORD-1847</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" fill="#666">Rajesh Kumar</text>
      <text x="350" y="25" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹2,450</text>
      <rect x="440" y="10" width="60" height="20" rx="10" fill="#4CAF50"/>
      <text x="470" y="24" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Paid</text>
    </g>
    
    <g transform="translate(20, 110)">
      <rect width="510" height="40" fill="white" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="13" fill="#333">#ORD-1846</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" fill="#666">Priya Sharma</text>
      <text x="350" y="25" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹1,890</text>
      <rect x="440" y="10" width="60" height="20" rx="10" fill="#FF9800"/>
      <text x="470" y="24" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Pending</text>
    </g>
    
    <g transform="translate(20, 160)">
      <rect width="510" height="40" fill="#f9f9f9" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="13" fill="#333">#ORD-1845</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" fill="#666">Anil Reddy</text>
      <text x="350" y="25" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹3,240</text>
      <rect x="440" y="10" width="60" height="20" rx="10" fill="#4CAF50"/>
      <text x="470" y="24" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Paid</text>
    </g>
    
    <g transform="translate(20, 210)">
      <rect width="510" height="40" fill="white" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="13" fill="#333">#ORD-1844</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" fill="#666">Sunita Devi</text>
      <text x="350" y="25" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹5,670</text>
      <rect x="440" y="10" width="60" height="20" rx="10" fill="#4CAF50"/>
      <text x="470" y="24" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Paid</text>
    </g>
  </g>
  
  <!-- Top Products Section -->
  <g transform="translate(30, 590)">
    <rect width="1140" height="180" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Top Selling Products</text>
    
    <g transform="translate(30, 60)">
      <rect width="250" height="80" fill="#f9f9f9" rx="4"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Basmati Rice 1kg</text>
      <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">324 units sold</text>
      <text x="15" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹45,680</text>
    </g>
    
    <g transform="translate(300, 60)">
      <rect width="250" height="80" fill="white" rx="4"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Toor Dal 1kg</text>
      <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">289 units sold</text>
      <text x="15" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹38,950</text>
    </g>
    
    <g transform="translate(570, 60)">
      <rect width="250" height="80" fill="#f9f9f9" rx="4"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Sugar 1kg</text>
      <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">267 units sold</text>
      <text x="15" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹12,015</text>
    </g>
    
    <g transform="translate(840, 60)">
      <rect width="250" height="80" fill="white" rx="4"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Refined Oil 1L</text>
      <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">245 units sold</text>
      <text x="15" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">₹34,300</text>
    </g>
  </g>
</svg>
