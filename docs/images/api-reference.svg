<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#1e1e1e"/>
  
  <!-- Header -->
  <rect width="1200" height="60" fill="#252526"/>
  <text x="30" y="38" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#4CAF50">MK Stores API Documentation</text>
  <text x="1000" y="38" font-family="Arial, sans-serif" font-size="14" fill="#888">87+ Routes</text>
  
  <!-- Sidebar -->
  <rect x="0" y="60" width="280" height="740" fill="#252526"/>
  
  <!-- Sidebar Menu -->
  <g transform="translate(20, 90)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">ENDPOINTS</text>
    
    <g transform="translate(0, 25)">
      <rect width="240" height="30" fill="#2E7D32" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="white">GET /health</text>
    </g>
    
    <g transform="translate(0, 65)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#ccc">POST /auth/admin/login</text>
    </g>
    
    <g transform="translate(0, 105)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#ccc">POST /auth/otp/send</text>
    </g>
    
    <g transform="translate(0, 145)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#ccc">POST /auth/otp/verify</text>
    </g>
    
    <g transform="translate(0, 195)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">PRODUCTS</text>
    </g>
    
    <g transform="translate(0, 220)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#61AFEF">GET /products</text>
    </g>
    
    <g transform="translate(0, 260)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#61AFEF">GET /products/:id</text>
    </g>
    
    <g transform="translate(0, 300)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#98C379">POST /products</text>
    </g>
    
    <g transform="translate(0, 340)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#E5C07B">PUT /products/:id</text>
    </g>
    
    <g transform="translate(0, 390)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#888" font-weight="bold">ORDERS</text>
    </g>
    
    <g transform="translate(0, 415)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#98C379">POST /orders</text>
    </g>
    
    <g transform="translate(0, 455)">
      <rect width="240" height="30" fill="#37373d" rx="4"/>
      <text x="10" y="20" font-family="Consolas, monospace" font-size="13" fill="#61AFEF">GET /orders</text>
    </g>
  </g>
  
  <!-- Main Content Area -->
  <g transform="translate(300, 80)">
    <!-- Request Section -->
    <rect width="880" height="320" rx="8" fill="#2d2d30" stroke="#3e3e42" stroke-width="1"/>
    <rect width="880" height="40" rx="8" fill="#2E7D32"/>
    <text x="20" y="28" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="white">GET</text>
    <text x="80" y="28" font-family="Consolas, monospace" font-size="14" fill="white">/api/v1/health</text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#888">Headers</text>
    <rect x="20" y="85" width="840" height="80" fill="#1e1e1e" rx="4"/>
    <text x="35" y="110" font-family="Consolas, monospace" font-size="12" fill="#98C379">"Content-Type"</text>
    <text x="200" y="110" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="220" y="110" font-family="Consolas, monospace" font-size="12" fill="#E5C07B">"application/json"</text>
    
    <text x="35" y="135" font-family="Consolas, monospace" font-size="12" fill="#98C379">"Authorization"</text>
    <text x="200" y="135" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="220" y="135" font-family="Consolas, monospace" font-size="12" fill="#E5C07B">"Bearer &lt;token&gt;"</text>
    
    <text x="20" y="195" font-family="Arial, sans-serif" font-size="13" fill="#888">Query Parameters</text>
    <rect x="20" y="205" width="840" height="80" fill="#1e1e1e" rx="4"/>
    <text x="35" y="230" font-family="Consolas, monospace" font-size="12" fill="#98C379">"lang"</text>
    <text x="120" y="230" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="140" y="230" font-family="Consolas, monospace" font-size="12" fill="#E5C07B">"en" | "te"</text>
    <text x="300" y="230" font-family="Consolas, monospace" font-size="11" fill="#666">(optional)</text>
    
    <text x="35" y="255" font-family="Consolas, monospace" font-size="12" fill="#98C379">"page"</text>
    <text x="120" y="255" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="140" y="255" font-family="Consolas, monospace" font-size="12" fill="#61AFEF">1</text>
    <text x="180" y="255" font-family="Consolas, monospace" font-size="11" fill="#666">(default)</text>
  </g>
  
  <!-- Response Section -->
  <g transform="translate(300, 420)">
    <rect width="880" height="360" rx="8" fill="#2d2d30" stroke="#3e3e42" stroke-width="1"/>
    
    <g transform="translate(0, 0)">
      <rect width="880" height="35" rx="8" fill="#37373d"/>
      <text x="20" y="23" font-family="Arial, sans-serif" font-size="13" fill="#4CAF50" font-weight="bold">Response: 200 OK</text>
      <circle cx="800" cy="17" r="6" fill="#4CAF50"/>
      <text x="820" y="23" font-family="Arial, sans-serif" font-size="12" fill="#4CAF50">Success</text>
    </g>
    
    <rect x="20" y="50" width="840" height="290" fill="#1e1e1e" rx="4"/>
    
    <!-- JSON Response -->
    <text x="35" y="75" font-family="Consolas, monospace" font-size="12" fill="#ccc">{</text>
    <text x="50" y="100" font-family="Consolas, monospace" font-size="12" fill="#98C379">"success"</text>
    <text x="140" y="100" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="160" y="100" font-family="Consolas, monospace" font-size="12" fill="#61AFEF">true</text>
    <text x="200" y="100" font-family="Consolas, monospace" font-size="12" fill="#ccc">,</text>
    
    <text x="50" y="125" font-family="Consolas, monospace" font-size="12" fill="#98C379">"status"</text>
    <text x="140" y="125" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="160" y="125" font-family="Consolas, monospace" font-size="12" fill="#E5C07B">"healthy"</text>
    <text x="250" y="125" font-family="Consolas, monospace" font-size="12" fill="#ccc">,</text>
    
    <text x="50" y="150" font-family="Consolas, monospace" font-size="12" fill="#98C379">"uptime"</text>
    <text x="140" y="150" font-family="Consolas, monospace" font-size="12" fill="#ccc">: {</text>
    <text x="70" y="175" font-family="Consolas, monospace" font-size="12" fill="#98C379">"processSeconds"</text>
    <text x="220" y="175" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="240" y="175" font-family="Consolas, monospace" font-size="12" fill="#61AFEF">244</text>
    <text x="270" y="175" font-family="Consolas, monospace" font-size="12" fill="#ccc">,</text>
    <text x="70" y="200" font-family="Consolas, monospace" font-size="12" fill="#98C379">"systemSeconds"</text>
    <text x="220" y="200" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="240" y="200" font-family="Consolas, monospace" font-size="12" fill="#61AFEF">11774</text>
    <text x="50" y="225" font-family="Consolas, monospace" font-size="12" fill="#ccc">},</text>
    
    <text x="50" y="250" font-family="Consolas, monospace" font-size="12" fill="#98C379">"checks"</text>
    <text x="140" y="250" font-family="Consolas, monospace" font-size="12" fill="#ccc">: {</text>
    <text x="70" y="275" font-family="Consolas, monospace" font-size="12" fill="#98C379">"database"</text>
    <text x="180" y="275" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="200" y="275" font-family="Consolas, monospace" font-size="12" fill="#E5C07B">"ok"</text>
    <text x="50" y="300" font-family="Consolas, monospace" font-size="12" fill="#ccc">},</text>
    
    <text x="50" y="325" font-family="Consolas, monospace" font-size="12" fill="#98C379">"node"</text>
    <text x="140" y="325" font-family="Consolas, monospace" font-size="12" fill="#ccc">:</text>
    <text x="160" y="325" font-family="Consolas, monospace" font-size="12" fill="#E5C07B">"v22.18.0"</text>
    
    <text x="35" y="350" font-family="Consolas, monospace" font-size="12" fill="#ccc">}</text>
  </g>
</svg>
